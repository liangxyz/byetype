name: Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri binary (bare exe)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: byetype-windows-exe
          path: src-tauri/target/x86_64-pc-windows-msvc/release/byetype.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ByeType ${{ github.ref_name }}
          files: src-tauri/target/x86_64-pc-windows-msvc/release/byetype.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
